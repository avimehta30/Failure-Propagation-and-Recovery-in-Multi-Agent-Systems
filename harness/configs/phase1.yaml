# Phase 1 experiment settings. Only the clean single-task run (build step 4) uses this so far.
llm:
  base_url: https://api.groq.com/openai/v1
  model: qwen/qwen3.8-27b
  api_key_env: [GROQ_API_KEY, GROQ]
  temperature: 0
  max_tokens: 2000

max_steps: 10            # per agent
run_visible_tests: false # executor self-testing is off by default (it can hide propagation)
