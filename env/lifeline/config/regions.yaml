# Per-region operating rules. Several modules read these values; change them with care.
#
#   people_per_kit   how many people one food kit feeds for a distribution round
#   cash_per_cycle   cash transfer per eligible household per payment cycle (whole dollars)

regions:
  NVL:
    name: North Valley
    climate: temperate
    people_per_kit: 2
    cash_per_cycle: 40

  CPL:
    name: Coastal Plains
    climate: temperate
    people_per_kit: 2
    cash_per_cycle: 45

  HGL:
    name: Highlands
    climate: cold
    people_per_kit: 2
    cash_per_cycle: 50
